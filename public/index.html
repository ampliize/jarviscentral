<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis</title>
<style>
  :root { --bg:#05090b; --panel:#0b1417; --line:#12303a; --ink:#e6f6f6; --muted:#7fa3a8; --accent:#2fd3c4; --accent-dim:#0f4b4a; --warn:#ffb454; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display:flex; flex-direction:column; background: radial-gradient(circle at 50% -20%, #0e3a3a 0%, var(--bg) 55%); }
  header { display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid var(--line); }
  .core { width:30px; height:30px; border-radius:50%; border:2px solid var(--accent); box-shadow:0 0 18px var(--accent); position:relative; }
  .core::after { content:""; position:absolute; inset:7px; border-radius:50%; background:var(--accent); opacity:.85; }
  .busy .core { animation:pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 34px var(--accent); transform:scale(1.08); } }
  h1 { font-size:16px; letter-spacing:.3em; margin:0; font-weight:600; }
  header small { color:var(--muted); margin-left:auto; font-size:12px; }
  main { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; max-width:900px; width:100%; margin:0 auto; }
  .msg { padding:12px 14px; border-radius:12px; line-height:1.55; white-space:pre-wrap; word-wrap:break-word; max-width:92%; }
  .user { align-self:flex-end; background:var(--accent-dim); }
  .jarvis { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
  .tools { font-size:11px; color:var(--muted); margin-top:6px; }
  .error { border-color:var(--warn); color:var(--warn); }
  form { display:flex; gap:8px; padding:12px 16px 18px; max-width:900px; width:100%; margin:0 auto; }
  textarea { flex:1; resize:none; min-height:48px; max-height:160px; padding:12px; border-radius:12px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font:inherit; }
  textarea:focus { outline:none; border-color:var(--accent); }
  button { border:0; border-radius:12px; padding:0 18px; background:var(--accent); color:#032; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .empty { color:var(--muted); text-align:center; margin-top:15vh; }
  .empty b { color:var(--ink); }
  .link { background:none; color:var(--muted); padding:0; font-weight:400; font-size:12px; text-decoration:underline; }
</style>
</head>
<body>
<header>
  <div class="core" aria-hidden="true"></div>
  <h1>JARVIS</h1>
  <small id="status">pronto</small>
  <button class="link" id="nova" type="button">nova conversa</button>
</header>
<main id="log">
  <div class="empty" id="empty"><b>Como posso ajudar?</b><br>Ex.: "Como está a operação hoje?" · "O que está travando os projetos?" · "Quais falhas e acertos tivemos este mês?"</div>
</main>
<form id="form">
  <label for="q" style="position:absolute;left:-9999px">Mensagem</label>
  <textarea id="q" placeholder="Pergunte ao Jarvis…" rows="1"></textarea>
  <button id="send" type="submit">Enviar</button>
</form>
<script>
  const log = document.getElementById('log');
  const form = document.getElementById('form');
  const q = document.getElementById('q');
  const send = document.getElementById('send');
  const statusEl = document.getElementById('status');
  let conversationId = sessionStorage.getItem('jarvis_conversation') || null;

  const getToken = () => {
    let t = null;
    try { t = localStorage.getItem('jarvis_token'); } catch {}
    if (!t) {
      t = prompt('Senha de acesso do Jarvis (JARVIS_ACCESS_TOKEN):') || '';
      try { localStorage.setItem('jarvis_token', t); } catch {}
    }
    return t;
  };

  const add = (text, who, extra) => {
    document.getElementById('empty')?.remove();
    const div = document.createElement('div');
    div.className = 'msg ' + who + (extra?.error ? ' error' : '');
    div.textContent = text;
    if (extra?.tools?.length) {
      const t = document.createElement('div');
      t.className = 'tools';
      t.textContent = 'consultou: ' + extra.tools.map((x) => x.name + (x.ok ? '' : ' (falhou)')).join(', ');
      div.appendChild(t);
    }
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  };

  document.getElementById('nova').onclick = () => {
    conversationId = null;
    sessionStorage.removeItem('jarvis_conversation');
    log.innerHTML = '';
    add('Nova conversa iniciada.', 'jarvis');
  };

  q.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const message = q.value.trim();
    if (!message) return;
    add(message, 'user');
    q.value = '';
    send.disabled = true;
    document.body.classList.add('busy');
    statusEl.textContent = 'pensando…';
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + getToken() },
        body: JSON.stringify({ message, conversationId }),
      });
      const data = await res.json().catch(() => ({}));
      if (res.status === 401) {
        try { localStorage.removeItem('jarvis_token'); } catch {}
        add('Senha incorreta. Envie de novo para digitar a senha.', 'jarvis', { error: true });
      } else if (!res.ok) {
        add(data.error || 'Erro ao falar com o Jarvis.', 'jarvis', { error: true });
      } else {
        conversationId = data.conversationId;
        sessionStorage.setItem('jarvis_conversation', conversationId);
        add(data.answer, 'jarvis', { tools: data.tools });
      }
    } catch {
      add('Sem conexão com o servidor.', 'jarvis', { error: true });
    } finally {
      send.disabled = false;
      document.body.classList.remove('busy');
      statusEl.textContent = 'pronto';
      q.focus();
    }
  });
</script>
</body>
</html>
