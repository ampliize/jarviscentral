<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020816">
<title>Jarvis · Ampliize</title>
<link rel="icon" href="/camaleao.png">
<style>
  :root {
    --bg0:#020816; --grid:rgba(90,190,255,.07);
    --ink:#e8f6ff; --muted:#8fb4cc; --dim:#5d86a3;
    --cyan:#3fd6ff; --cyan-2:#8feaff; --line:rgba(90,200,255,.38);
    --glass:linear-gradient(180deg, rgba(10,44,98,.80), rgba(4,18,46,.88));
    --warn:#ffb454; --rec:#ff5d7a; --ok:#44f0b0;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --focus-top: 50vh;
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg0); color:var(--ink); font-family:var(--sans); }
  body {
    background:
      radial-gradient(ellipse at 50% 32%, rgba(30,110,220,.32), transparent 62%),
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 44px 44px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 44px 44px,
      linear-gradient(180deg, #041a44, var(--bg0) 88%);
  }
  body::after { content:""; position:fixed; inset:0; pointer-events:none; z-index:60;
    background:repeating-linear-gradient(180deg, rgba(255,255,255,.03) 0 1px, transparent 1px 3px); }
  #holo { position:fixed; inset:0; width:100%; height:100%; z-index:0; }
  button { font:inherit; }

  /* ---------- topo ---------- */
  .top { position:fixed; top:12px; left:50%; transform:translateX(-50%); z-index:20; }
  .pill { display:flex; align-items:center; gap:10px; padding:7px 14px; border:1px solid var(--line); border-radius:999px;
    background:rgba(4,20,50,.62); backdrop-filter:blur(6px); font:600 10px/1 var(--mono); letter-spacing:.14em; color:var(--muted); white-space:nowrap; }
  .pill button { all:unset; cursor:pointer; color:var(--cyan-2); }
  .pill button:hover, .pill button:focus-visible { color:#fff; text-decoration:underline; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--dim); flex:none; }
  .dot.ok { background:var(--ok); box-shadow:0 0 8px var(--ok); }
  .dot.bad { background:var(--warn); box-shadow:0 0 8px var(--warn); }
  .sep { width:1px; height:12px; background:var(--line); }
  #state { position:fixed; top:54px; left:50%; transform:translateX(-50%); z-index:20; text-align:center; pointer-events:none; }
  #stateLabel { font:600 13px var(--mono); letter-spacing:.5em; padding-left:.5em; color:var(--cyan); text-shadow:0 0 12px rgba(63,214,255,.8); }
  body[data-mode="listening"] #stateLabel { color:var(--ok); text-shadow:0 0 12px rgba(68,240,176,.8); }
  body[data-mode="error"] #stateLabel { color:var(--warn); text-shadow:0 0 12px rgba(255,180,84,.8); }
  #meter { display:flex; gap:3px; justify-content:center; margin-top:8px; height:12px; align-items:center; }
  #meter i { width:3px; height:2px; background:var(--cyan); opacity:.6; border-radius:1px; }

  /* ---------- card em foco ---------- */
  #focus { position:fixed; left:50%; top:var(--focus-top); transform:translateX(-50%); z-index:10;
    width:min(680px, calc(100vw - 32px)); max-height:calc(100vh - var(--focus-top) - var(--focus-gap, 150px)); overflow:auto; scrollbar-width:thin;
    -webkit-mask-image:linear-gradient(180deg, #000 calc(100% - 18px), transparent); mask-image:linear-gradient(180deg, #000 calc(100% - 18px), transparent); padding-bottom:14px; }
  #closeCard { position:absolute; top:10px; right:10px; z-index:2; width:28px; height:28px; border-radius:8px; border:1px solid var(--line);
    background:rgba(4,20,50,.6); color:var(--muted); cursor:pointer; line-height:1; }
  #closeCard:hover, #closeCard:focus-visible { color:#fff; border-color:var(--cyan); }
  .card { position:relative; background:var(--glass); border:1px solid var(--line); border-radius:12px; padding:16px 18px;
    box-shadow:0 0 28px rgba(40,160,255,.22), inset 0 0 24px rgba(60,180,255,.08); backdrop-filter:blur(8px); }
  .card.enter { animation:materialize .55s cubic-bezier(.2,.8,.2,1); }
  @keyframes materialize {
    from { opacity:0; transform:translateY(14px) scale(.96); clip-path:inset(0 0 100% 0); filter:brightness(2); }
    to { opacity:1; transform:none; clip-path:inset(0 0 0 0); filter:none; }
  }
  .card-head { display:flex; justify-content:space-between; gap:12px; align-items:center; padding-right:40px; }
  .rotulo { font:600 10px var(--mono); letter-spacing:.2em; color:var(--cyan-2); text-transform:uppercase; }
  .tag { font:600 10px var(--mono); letter-spacing:.12em; color:var(--cyan-2); border:1px solid var(--line); border-radius:999px; padding:3px 8px; }
  .title-row { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; margin-top:14px; }
  .titulo { margin:0; font-size:22px; line-height:1.2; font-weight:700; color:#fff; }
  .destaque { text-align:right; flex:none; }
  .destaque strong { display:block; font-size:28px; line-height:1; color:#fff; text-shadow:0 0 14px rgba(63,214,255,.6); }
  .destaque small { font:600 10px var(--mono); letter-spacing:.12em; color:var(--muted); text-transform:uppercase; }
  .texto { margin-top:12px; line-height:1.6; font-size:15px; white-space:pre-wrap; overflow-wrap:anywhere; color:#dcefff; }
  .itens { list-style:none; margin:12px 0 0; padding:0; display:grid; gap:6px; }
  .itens li { display:flex; gap:12px; align-items:flex-start; padding:9px 12px; border:1px solid rgba(90,200,255,.2); border-radius:8px; background:rgba(3,16,40,.55); }
  .itens li.alerta { border-color:rgba(255,180,84,.55); box-shadow:inset 3px 0 0 var(--warn); }
  .itens .n { font:600 11px var(--mono); color:var(--cyan); padding-top:2px; }
  .itens li.alerta .n { color:var(--warn); }
  .itens b { display:block; font-size:14px; font-weight:600; overflow-wrap:anywhere; }
  .itens small { display:block; margin-top:2px; font-size:12px; color:var(--muted); overflow-wrap:anywhere; }
  .vazio { margin:12px 0 0; color:var(--muted); font-size:14px; }
  .rodape { margin-top:12px; padding-top:10px; border-top:1px solid rgba(90,200,255,.18); font:600 10px var(--mono); letter-spacing:.12em; color:var(--dim); text-transform:uppercase; }
  .card.erro { border-color:rgba(255,180,84,.6); }
  .card.erro .titulo { color:var(--warn); font-size:17px; }
  .tw { font:700 20px var(--mono); color:#fff; min-height:1.4em; margin-top:10px; text-shadow:0 0 10px rgba(63,214,255,.7); }
  .tw::after { content:"▍"; animation:blink 1s steps(1) infinite; color:var(--cyan); }
  @keyframes blink { 50% { opacity:0; } }
  .tabs { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .tabs span { font:600 10px var(--mono); letter-spacing:.14em; padding:6px 10px; border:1px solid var(--line); border-radius:6px; color:var(--muted); }
  .tabs span.on { color:#021; background:var(--cyan); border-color:var(--cyan); box-shadow:0 0 12px rgba(63,214,255,.6); }
  .bar { height:3px; margin-top:14px; background:rgba(90,200,255,.15); border-radius:2px; overflow:hidden; }
  .bar i { display:block; height:100%; width:40%; background:var(--cyan); box-shadow:0 0 10px var(--cyan); animation:load 1.6s ease-in-out infinite; }
  @keyframes load { from { transform:translateX(-100%); } to { transform:translateX(260%); } }

  /* ---------- doca de cards (coluna à direita no desktop, fileira embaixo no resto) ---------- */
  #dock { position:fixed; z-index:10; display:flex; gap:10px; scrollbar-width:thin;
    right:18px; top:110px; bottom:150px; width:220px; flex-direction:column; overflow-y:auto; padding:2px; }
  .mini { flex:none; width:100%; height:84px; text-align:left; cursor:pointer; padding:10px 12px; border-radius:10px; color:var(--ink);
    background:var(--glass); border:1px solid rgba(90,200,255,.3); box-shadow:0 0 14px rgba(40,160,255,.14); display:flex; flex-direction:column; gap:4px;
    overflow:hidden; animation:dockIn .35s ease-out; }
  .mini:hover, .mini:focus-visible { border-color:var(--cyan); outline:none; box-shadow:0 0 18px rgba(63,214,255,.35); }
  .mini .rotulo { font-size:9px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mini b { font-size:13px; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mini .v { font-size:17px; font-weight:700; color:#fff; margin-top:auto; }
  @media (max-width:1100px) {
    #dock { right:auto; top:auto; left:50%; transform:translateX(-50%); bottom:var(--dock-bottom, 140px); width:auto; max-width:calc(100vw - 24px);
      flex-direction:row; overflow-x:auto; overflow-y:hidden; padding:2px 2px 6px; }
    .mini { width:160px; height:60px; padding:8px 10px; }
    .mini .v { display:none; }
    :root { --focus-gap: 222px; }
  }
  @keyframes dockIn { from { opacity:0; transform:translateY(10px) scale(.92); } }

  /* ---------- legenda e barra de pergunta ---------- */
  #subs { position:fixed; left:50%; transform:translateX(-50%); bottom:80px; z-index:15; width:min(860px, calc(100vw - 32px)); text-align:center;
    font-size:19px; font-weight:700; line-height:1.35; color:#fff; text-shadow:0 2px 10px rgba(0,0,0,.9), 0 0 2px #000; opacity:0; transition:opacity .25s; pointer-events:none;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  #subs.on { opacity:1; }
  #ask { position:fixed; left:50%; transform:translateX(-50%); bottom:max(14px, env(safe-area-inset-bottom)); z-index:20; display:flex; align-items:center; gap:8px;
    width:min(620px, calc(100vw - 24px)); padding:6px; border:1px solid var(--line); border-radius:999px; background:rgba(4,20,50,.72); backdrop-filter:blur(8px); }
  #q { flex:1; min-width:0; background:none; border:0; color:var(--ink); font-size:15px; padding:10px 14px; outline:none; }
  #q::placeholder { color:var(--dim); }
  .round { width:44px; height:44px; flex:none; border-radius:50%; border:1px solid var(--line); background:rgba(8,40,90,.8); color:var(--cyan-2);
    cursor:pointer; display:grid; place-items:center; }
  .round:hover, .round:focus-visible { border-color:var(--cyan); color:#fff; outline:none; }
  .round:disabled { opacity:.45; cursor:default; }
  #mic { width:52px; height:52px; box-shadow:0 0 16px rgba(63,214,255,.35); }
  #mic.on { background:var(--rec); border-color:var(--rec); color:#fff; box-shadow:0 0 22px rgba(255,93,122,.7); animation:pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform:scale(1.07); } }
  .round svg { width:20px; height:20px; }

  /* ---------- painel lateral (pulso) ---------- */
  #side { position:fixed; left:18px; top:110px; z-index:10; width:230px; }
  #side .card { padding:14px; }
  .pulse-row { display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:8px 0; border-bottom:1px solid rgba(90,200,255,.12); }
  .pulse-row:last-child { border-bottom:0; }
  .pulse-row span { font:600 10px var(--mono); letter-spacing:.1em; color:var(--muted); text-transform:uppercase; }
  .pulse-row b { font-size:16px; }
  .pulse-row.alerta b { color:var(--warn); }
  @media (max-width:1100px) { #side { display:none; } }

  /* ---------- gerenciar HUD ---------- */
  #hud { position:fixed; top:48px; right:16px; z-index:30; width:min(300px, calc(100vw - 32px)); }
  #hud .card { padding:14px 16px; }
  .opt { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:9px 0; font-size:14px; border-bottom:1px solid rgba(90,200,255,.12); }
  .opt:last-of-type { border-bottom:0; }
  .opt input[type=checkbox] { width:18px; height:18px; accent-color:var(--cyan); }
  .opt input[type=range] { width:110px; accent-color:var(--cyan); }
  .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .btn { border:1px solid var(--line); background:rgba(8,40,90,.7); color:var(--cyan-2); border-radius:8px; padding:8px 12px; cursor:pointer;
    font:600 11px var(--mono); letter-spacing:.1em; text-transform:uppercase; }
  .btn:hover, .btn:focus-visible { color:#fff; border-color:var(--cyan); outline:none; }

  /* ---------- login ---------- */
  #login { position:fixed; inset:0; z-index:40; display:grid; place-items:center; background:rgba(2,8,22,.55); backdrop-filter:blur(3px); padding:16px; }
  #login .card { width:min(400px, 100%); }
  #login input { width:100%; margin-top:12px; padding:12px 14px; border-radius:8px; border:1px solid var(--line); background:rgba(3,16,40,.8); color:var(--ink); font-size:15px; }
  #login input:focus { outline:none; border-color:var(--cyan); }
  #login p { color:var(--muted); font-size:13px; line-height:1.5; margin:8px 0 0; }
  #loginMsg { color:var(--warn) !important; min-height:1.2em; }

  @media (max-width:700px) {
    :root { --dock-bottom: 146px; --focus-gap: 226px; }
    .titulo { font-size:18px; }
    .destaque strong { font-size:22px; }
    #subs { font-size:15px; bottom:80px; -webkit-line-clamp:3; }
    .mini { width:140px; }
    .pill .hide-sm { display:none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card.enter, .mini { animation:none; }
    #mic.on { animation:none; }
  }
</style>
</head>
<body data-mode="idle">
<canvas id="holo" aria-hidden="true"></canvas>

<div class="top">
  <div class="pill">
    <span class="dot" id="syncDot"></span>
    <span id="syncText">AMPLIIZE</span>
    <span class="sep"></span>
    <button type="button" id="briefBtn" title="Resumo do dia (ou diga “bom dia”)">BRIEFING</button>
    <span class="sep"></span>
    <button type="button" id="opsBtn" title="Semáforo da operação inteira">MONITOR</button>
    <span class="sep"></span>
    <button type="button" id="hudBtn" aria-expanded="false" aria-controls="hud">GERENCIAR <span class="hide-sm">HUD</span></button>
  </div>
</div>

<div id="state">
  <div id="stateLabel">EM ESPERA</div>
  <div id="meter" aria-hidden="true"></div>
</div>

<aside id="side" hidden>
  <div class="card">
    <div class="rotulo">AMPLIIZE · PULSO</div>
    <div id="pulse" style="margin-top:6px"></div>
  </div>
</aside>

<section id="focus" hidden aria-live="polite">
  <button type="button" id="closeCard" aria-label="Fechar card">✕</button>
  <div id="focusBody"></div>
</section>

<nav id="dock" aria-label="Cards anteriores"></nav>

<div id="subs" role="status" aria-live="polite"></div>

<form id="ask" autocomplete="off">
  <label for="q" style="position:absolute;left:-9999px">Pergunte ao Jarvis</label>
  <input id="q" placeholder="Pergunte ao Jarvis… (ou diga “bom dia”)" enterkeyhint="send">
  <button class="round" id="mic" type="button" title="Falar (atalho: espaço)" aria-label="Falar com o Jarvis">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
  </button>
  <button class="round" id="send" type="submit" aria-label="Enviar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </button>
</form>

<div id="hud" hidden>
  <div class="card">
    <div class="rotulo">GERENCIAR HUD</div>
    <label class="opt" id="wakeOpt" title="Diga “Jarvis” e a pergunta, com esta aba aberta (Chrome ou Edge)">Chamar por “Jarvis” <input type="checkbox" id="wakeToggle"></label>
    <label class="opt">Falar as respostas <input type="checkbox" id="speakToggle"></label>
    <label class="opt" title="Para a direita, mais alto (acima do volume do sistema, sem distorcer)">Volume da voz <input type="range" id="volume" min="0.5" max="3" step="0.1"></label>
    <label class="opt" title="Toca quando o briefing começa e abaixa enquanto ele fala">Trilha no briefing <input type="checkbox" id="musicToggle"></label>
    <label class="opt" title="Volume da trilha do briefing">Volume da trilha <input type="range" id="musicVolume" min="0" max="1" step="0.05"></label>
    <div class="opt"><span id="musicName">Trilha: vinheta padrão</span></div>
    <div class="actions" style="margin-top:4px">
      <button class="btn" type="button" id="musicPick" title="mp3, m4a, ogg ou wav, até 15 MB">Escolher música</button>
      <button class="btn" type="button" id="musicTest">Testar</button>
      <button class="btn" type="button" id="musicDel" hidden>Remover</button>
      <input type="file" id="musicFile" accept="audio/*,.mp3,.m4a,.aac,.ogg,.wav" hidden>
    </div>
    <label class="opt" title="Bata duas palmas para ele começar a ouvir (com esta aba aberta)">Modo palmas <input type="checkbox" id="clapToggle"></label>
    <label class="opt" title="Para a direita, precisa bater mais forte">Sensibilidade da palma <input type="range" id="clapThresh" min="0.15" max="0.9" step="0.05"></label>
    <div class="actions">
      <button class="btn" type="button" id="cfg">Configuração</button>
      <button class="btn" type="button" id="nova">Nova conversa</button>
      <button class="btn" type="button" id="skillsBtn">Habilidades</button>
      <button class="btn" type="button" id="sair">Sair</button>
    </div>
  </div>
</div>

<div id="login" hidden>
  <form class="card" id="loginForm">
    <div class="rotulo">JARVIS · AMPLIIZE</div>
    <h2 class="titulo" style="margin-top:6px">Senha de acesso</h2>
    <p>Está nos Logs do Easypanel, na linha “SENHA DE ACESSO DO JARVIS”.</p>
    <label for="pass" style="position:absolute;left:-9999px">Senha</label>
    <input id="pass" type="password" autocomplete="current-password" required>
    <p id="loginMsg"></p>
    <div class="actions"><button class="btn" type="submit">Entrar</button></div>
  </form>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const store = {
    get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
    del: (k) => { try { localStorage.removeItem(k); } catch {} },
  };
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const speakToggle = $('speakToggle'), clapToggle = $('clapToggle'), clapThresh = $('clapThresh');
  const q = $('q'), mic = $('mic'), send = $('send');
  speakToggle.checked = store.get('jarvis_speak', '1') === '1';
  clapThresh.value = store.get('jarvis_clap_thresh', '0.45');
  let conversationId = sessionStorage.getItem('jarvis_conversation') || null;

  // ================= estado =================
  const LABELS = { idle: 'EM ESPERA', wake: 'DIGA “JARVIS”', listening: 'OUVINDO', transcribing: 'TRANSCREVENDO', thinking: 'PENSANDO', speaking: 'FALANDO', clap: 'AGUARDANDO PALMAS', error: 'ATENÇÃO' };
  let mode = 'idle';
  const setMode = (m) => {
    mode = m;
    $('stateLabel').textContent = LABELS[m] || m.toUpperCase();
    document.body.dataset.mode = m;
    // O reconhecimento do "Jarvis" fica pausado enquanto ele fala ou pensa (não ouve a própria voz).
    if (m === 'speaking' || m === 'thinking' || m === 'transcribing') pauseWake();
    else if (m !== 'listening') resumeWake();
  };
  const restMode = () => setMode(wakeActive() ? 'wake' : clapToggle.checked ? 'clap' : 'idle');
  // Pedido de rede em andamento (chat, briefing, transcrição): mic e envio ficam travados.
  let busy = false;
  const setBusy = (b) => { busy = b; send.disabled = b; mic.disabled = b; };

  // ================= acesso =================
  let token = store.get('jarvis_token', '');
  const showLogin = (msg) => { $('login').hidden = false; $('loginMsg').textContent = msg || ''; setTimeout(() => $('pass').focus(), 30); };
  const api = async (path, init = {}) => {
    if (!token) { showLogin(); throw new Error('Digite a senha de acesso.'); }
    const res = await fetch(path, { ...init, headers: { ...(init.headers || {}), Authorization: 'Bearer ' + token } });
    if (res.status === 401) { token = ''; store.del('jarvis_token'); showLogin('Senha incorreta. Tente de novo.'); throw new Error('Senha incorreta.'); }
    return res;
  };
  $('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const v = $('pass').value.trim();
    if (!v) return;
    token = v; store.set('jarvis_token', v); $('pass').value = ''; $('login').hidden = true;
    afterLogin();
  });

  // ================= cards =================
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const clean = (t) => String(t || '').replace(/\*\*(.+?)\*\*/g, '$1').replace(/^#+\s*/gm, '').replace(/`/g, '');
  const trunc = (t, n) => (t.length > n ? t.slice(0, n - 1) + '…' : t);

  let twTimer = null;
  function buildCard(c) {
    const card = el('article', 'card enter' + (c.tipo ? ' ' + c.tipo : ''));
    const head = el('header', 'card-head');
    head.append(el('span', 'rotulo', c.rotulo || ''));
    if (c.tag) head.append(el('span', 'tag', c.tag));
    card.append(head);
    const row = el('div', 'title-row');
    row.append(el('h2', 'titulo', c.titulo || ''));
    if (c.destaque) { const d = el('div', 'destaque'); d.append(el('strong', null, c.destaque.valor), el('small', null, c.destaque.legenda)); row.append(d); }
    card.append(row);
    if (c.tipo === 'loading') {
      const tw = el('div', 'tw');
      const tabs = el('div', 'tabs');

  let focusData = null;

  function showError(message, { setup } = {}) {

  // ================= voz (falar) =================
  const player = new Audio();
  player.preload = 'auto';
  // Voz → ganho (volume) → compressor (sobe o volume sem distorcer) → medidor → alto-falante.
  let outCtx = null, outAnalyser = null, outBuf = null, outGain = null;
  const volumeInput = $('volume');

  const ensureOut = () => {
    if (outCtx) return;

      outCtx = new (window.AudioContext || window.webkitAudioContext)();
      outGain = outCtx.createGain();
      outGain.gain.value = Number(volumeInput.value) || 1.8;
      const comp = outCtx.createDynamicsCompressor();
      comp.threshold.value = -20;
      comp.knee.value = 12;
      comp.ratio.value = 4;
      comp.attack.value = 0.003;
      comp.release.value = 0.25;

    if (!outAnalyser || player.paused) return 0;

  // ================= trilha do briefing =================
  // Abre o briefing em volume cheio, abaixa enquanto ele fala e some no fim.
  // Usa a música que o dono enviou (GERENCIAR HUD); sem ela, uma vinheta gerada aqui.
  const musicToggle = $('musicToggle'), musicVolume = $('musicVolume');
  musicToggle.checked = store.get('jarvis_music', '1') === '1';
  musicVolume.value = store.get('jarvis_music_volume', '0.7');
  const INTRO_MS = 3500, DUCK = 0.2;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const musicEl = new Audio();
  musicEl.preload = 'auto';
  let musicBus = null, musicUrl = null, musicInfo, synth = null, musicSeq = 0, musicDucked = false, musicStartedAt = 0;
  const musicLevel = () => Math.min(1, Number(musicVolume.value) || 0);
  const ensureMusicOut = () => {
    ensureOut();
    if (musicBus || !outCtx) return;

      // Direto para o alto-falante: não passa pelo medidor, então o holograma só mexe com a voz.
      musicBus = outCtx.createGain();
      musicBus.connect(outCtx.destination);
      outCtx.createMediaElementSource(musicEl).connect(musicBus);
    } catch { musicBus = null; }
  };
  const setMusicGain = (target, seconds) => {
    if (!musicBus) { musicEl.volume = Math.max(0, Math.min(1, target)); return; }
    const g = musicBus.gain, now = outCtx.currentTime;
    g.cancelScheduledValues(now);
    g.setValueAtTime(g.value, now);
    g.linearRampToValueAtTime(target, now + Math.max(0.01, seconds));

    if (!synth) return;

    try { synth.out.disconnect(); } catch {}

  };
  /** Vinheta própria (~5 s): o reator ligando e acordes de guitarra distorcida. */
  function playSynth() {
    const ctx = outCtx, t0 = ctx.currentTime + 0.05;
    const out = ctx.createGain();
    out.connect(musicBus);
    const nodes = [];
    const shaper = ctx.createWaveShaper();
    const curve = new Float32Array(1024);
    for (let i = 0; i < curve.length; i++) curve[i] = Math.tanh(3.5 * (i / 512 - 1));
    shaper.curve = curve;
    const tone = ctx.createBiquadFilter();
    tone.type = 'lowpass';
    tone.frequency.value = 2400;
    shaper.connect(tone);
    tone.connect(out);

      for (const mult of [1, 1.5, 2]) {

        o.type = 'sawtooth'; o.frequency.value = root * mult; o.detune.value = (Math.random() - 0.5) * 14;
        env(g, at, 0.16, dur);

        o.start(at); o.stop(at + dur + 0.05);

      const k = ctx.createOscillator(), kg = ctx.createGain();
      k.frequency.setValueAtTime(140, at); k.frequency.exponentialRampToValueAtTime(40, at + 0.25);
      env(kg, at, 0.8, 0.35);
      k.connect(kg); kg.connect(out);
      k.start(at); k.stop(at + 0.4);
      nodes.push(k);
    };
    const t1 = t0 + 1.5;
    chord(82.41, t1, 0.45);        // E
    chord(82.41, t1 + 0.6, 0.45);  // E
    chord(98, t1 + 1.2, 0.3);      // G
    chord(110, t1 + 1.5, 0.45);    // A
    chord(82.41, t1 + 2.1, 1.9);   // E (segura)
    synth = { out, nodes };
  }
  /** Começa a trilha. Resolve true quando ela está tocando. test = ignora a opção desligada. */
  async function startMusic(test = false) {
    stopMusic(0);
    const my = ++musicSeq;
    musicDucked = false;
    if ((!musicToggle.checked && !test) || !musicLevel()) return false;
    ensureMusicOut();
    if (outCtx && outCtx.state === 'suspended') await outCtx.resume().catch(() => {});
    setMusicGain(musicLevel(), 0);
    if (musicInfo === undefined) await refreshMusicInfo();
    if (musicInfo) {
      try {
        if (!musicUrl) {
          const r = await api('/api/briefing/musica');
          if (!r.ok) throw new Error('sem trilha');
          musicUrl = URL.createObjectURL(await r.blob());
        }
        if (my !== musicSeq) return false;
        musicEl.src = musicUrl;
        musicEl.currentTime = 0;
        // Chegou atrasada (arquivo grande): já entra baixa se a voz começou.

        musicStartedAt = Date.now();

    playSynth();
    musicStartedAt = Date.now();
    return true;

  const duckMusic = () => { musicDucked = true; setMusicGain(musicLevel() * DUCK, 0.8); };

  }
  musicToggle.onchange = () => { store.set('jarvis_music', musicToggle.checked ? '1' : '0'); if (!musicToggle.checked) stopMusic(0.3); };
  musicVolume.oninput = () => {

  function setMusicInfo(info) {

  }
  const AUDIO_EXT = { mp3: 'audio/mpeg', m4a: 'audio/mp4', aac: 'audio/aac', ogg: 'audio/ogg', wav: 'audio/wav', webm: 'audio/webm' };
  window.__jarvis = { ...(window.__jarvis || {}), music: () => ({ tocando: !musicEl.paused || !!synth, arquivo: !musicEl.paused, vinheta: !!synth, abaixada: musicDucked, ganho: musicBus ? musicBus.gain.value : musicEl.volume }) };
  $('musicPick').onclick = () => $('musicFile').click();

      const d = await r.json().catch(() => ({}));

  $('musicTest').onclick = async () => {

  let speakSeq = 0, fakeSpeech = false, endCurrent = null;

  };
  /** Pede a voz da OpenAI. force = a pergunta foi falada (responde em voz mesmo com a opção desligada). */
  const fetchTts = (text, force) => {
    const ctrl = new AbortController();
    const promise = (speakToggle.checked || force) && text
      ? api('/api/voice/speak', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }), signal: ctrl.signal })

  /** Agrupa as frases em pedaços para a voz: o primeiro é curto para começar a falar logo. */
  const chunksOf = (parts) => {
    const out = [];

    for (const p of parts) {

      if (cur && (cur + ' ' + p).length > max) { out.push(cur); cur = p; } else cur = cur ? cur + ' ' + p : p;

  /** Toca um pedaço de áudio com a legenda acompanhando as frases dele. */
  async function playBlob(blob, parts) {
    ensureOut();
    if (outCtx && outCtx.state === 'suspended') await outCtx.resume().catch(() => {});
    const url = URL.createObjectURL(blob);
    const total = parts.join(' ').length;
    player.src = url;
    subtitle(parts[0]);
    player.ontimeupdate = () => {
      if (!player.duration || !isFinite(player.duration)) return;
      const pos = (player.currentTime / player.duration) * total;
      let acc = 0;
      for (const s of parts) { acc += s.length + 1; if (pos <= acc) { if ($('subs').textContent !== s) subtitle(s); break; } }
    };

      endCurrent = resolve;
      player.onended = () => resolve(true);
      player.onerror = () => resolve(false);

    player.ontimeupdate = null;

  /**
   * Fala o texto com legenda sincronizada. A voz é pedida em pedaços: o

   */
  async function say(text, { pre, force } = {}) {
    const my = ++speakSeq;
    const parts = sentences(text);
    if (!parts.length) { pre?.abort(); return true; }
    const voice = speakToggle.checked || !!force;
    setMode('speaking');
    subtitle(parts[0]);
    const chunks = chunksOf(parts);
    const tts = [pre || fetchTts(chunks[0], force)];
    const abortRest = (from) => tts.slice(from).forEach((t) => t?.abort());
    let spoken = 0;

      let done = false;

      };
      next();
    });
  }

  // ================= briefing =================
  // O painel lateral já busca o briefing ao abrir; reaproveita por 90 s.
  let briefCache = null;
  const loadBriefingData = async () => {
    if (briefCache && Date.now() - briefCache.at < 90_000) return briefCache.data;
    const res = await api('/api/briefing');

    if (briefingRunning || busy) return;

    stopSpeaking();
    ensureOut();
    const my = speakSeq;
    const musicOn = startMusic();
    setBusy(true);
    setMode('thinking');
    showCard({ tipo: 'loading', rotulo: 'BRIEFING DO DIA', titulo: 'Preparando seu briefing' });
    subtitle('');
    let pending = null;
    try {
      const data = await loadBriefingData();

      let current = fetchTts(firstChunk(texts[0]), force);

  // ================= monitor da operação =================
  const STATE_ICON = { ok: '🟢', atencao: '🟡', critico: '🔴', sem_dados: '⚪' };
  const STATE_TEXT = { ok: 'tudo em ordem', atencao: 'pedindo atenção', critico: 'com ponto crítico', sem_dados: 'sem dados' };
  async function showOperation() {
    if (busy) return;
    stopSpeaking();
    ensureOut();
    setBusy(true);
    setMode('thinking');
    try {
      const r = await api('/api/operacao');
      const op = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(op.error || 'Não consegui montar o monitor.');
      const areas = op.areas || [];
      showCard({
        rotulo: 'OPERAÇÃO · MONITOR',
        titulo: 'Operação ' + (STATE_TEXT[op.geral] || ''),
        destaque: { valor: STATE_ICON[op.geral] || '⚪', legenda: 'geral' },
        itens: areas.map((a) => ({
          titulo: (STATE_ICON[a.estado] || '⚪') + ' ' + a.nome + ' · ' + a.resumo,

    }
    if (mode === 'listening' && analyser) return Math.min(1, levels().rms * 9);
    if (mode === 'thinking' || mode === 'transcribing') return 0.16 + 0.08 * Math.sin(t * 0.004);
    return 0.04;
  };

  const holo = (() => {
    const cv = $('holo'), ctx = cv.getContext('2d');
    let W = 0, H = 0;
    const resize = () => {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      W = innerWidth; H = innerHeight;
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      document.documentElement.style.setProperty('--focus-top', Math.round(H * (W < 700 ? 0.38 : W < 1100 ? 0.43 : 0.42)) + 'px');
    };
    addEventListener('resize', resize);
    resize();

    // Pontos da silhueta do camaleão (logo da Ampliize).
    let fill = null, edge = null, tinted = null, aspect = 168 / 262;
    const img = new Image();
    img.onload = () => {
      const w = img.naturalWidth, h = img.naturalHeight;
      aspect = h / w;
      const oc = document.createElement('canvas');
      oc.width = w; oc.height = h;
      const o = oc.getContext('2d');
      o.drawImage(img, 0, 0);
      const a = o.getImageData(0, 0, w, h).data;
      const alpha = (x, y) => (x < 0 || y < 0 || x >= w || y >= h ? 0 : a[(y * w + x) * 4 + 3]);
      const f = [], e = [], step = 2;
      for (let y = 0; y < h; y += step) {
        for (let x = 0; x < w; x += step) {
          if (alpha(x, y) < 128) continue;
          const nx = x / w, ny = y / h;
          const p = {
            nx, ny, s: Math.random() * 100,
            // maxilar (abre quando fala) e olho (pisca)
            jaw: nx > 0.76 && ny > 0.37 + (nx - 0.76) * 0.26 && ny < 0.49,
            eye: Math.hypot(x - w * 0.878, y - h * 0.268) < h * 0.075,
          };
          const border = alpha(x - step, y) < 128 || alpha(x + step, y) < 128 || alpha(x, y - step) < 128 || alpha(x, y + step) < 128;
          (border ? e : f).push(p);
        }
      }
      fill = f; edge = e;
      tinted = document.createElement('canvas');
      tinted.width = w; tinted.height = h;
      const t = tinted.getContext('2d');
      t.drawImage(img, 0, 0);
      t.globalCompositeOperation = 'source-in';
      t.fillStyle = '#35d8ff';
      t.fillRect(0, 0, w, h);
    };
    img.src = '/camaleao.png';

    const dust = Array.from({ length: 34 }, () => ({ x: Math.random() * 2 - 1, y: Math.random(), v: 0.15 + Math.random() * 0.35, s: Math.random() }));
    const lay = { cy: 0.43, h: 0.3 };
    let ampS = 0;
    const HUE = { idle: 200, wake: 196, clap: 198, listening: 165, transcribing: 208, thinking: 208, speaking: 192, error: 30 };

    function rings(t, amp, cx, cy, R, hue, speed) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineWidth = 1.1;
      ctx.shadowColor = `hsla(${hue},100%,60%,.9)`;
      ctx.shadowBlur = 10;
      for (let i = 0; i < 7; i++) {
        const rot = t * 0.00012 * speed * (i % 2 ? 1 : -1) + i * 0.9;
        const squash = 0.42 + 0.52 * Math.abs(Math.sin(i * 1.7 + t * 0.00025 * speed));
        const cr = Math.cos(rot), sr = Math.sin(rot);
        ctx.beginPath();
        for (let k = 0; k <= 96; k++) {
          const a = (k / 96) * Math.PI * 2;
          const wob = 1 + (0.025 + amp * 0.17) * Math.sin(a * 3 + t * 0.0016 * speed + i * 1.3) + 0.018 * Math.sin(a * 5 - t * 0.0021 * speed + i);
          const x0 = Math.cos(a) * R * wob, y0 = Math.sin(a) * R * wob * squash;
          const x = cx + x0 * cr - y0 * sr, y = cy + x0 * sr + y0 * cr;
          if (k) ctx.lineTo(x, y); else ctx.moveTo(x, y);
        }
        ctx.strokeStyle = `hsla(${hue + i * 3},100%,${62 + amp * 14}%,${0.14 + amp * 0.34})`;
        ctx.stroke();
      }
      ctx.restore();
    }

    function emitter(t, amp, cx, baseY, bw, hue) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const rx = bw * 0.42, ry = bw * 0.055;
      // cone de luz
      const g = ctx.createLinearGradient(0, baseY, 0, baseY - bw * 0.62);
      g.addColorStop(0, `hsla(${hue},100%,60%,${0.14 + amp * 0.1})`);
      g.addColorStop(1, `hsla(${hue},100%,60%,0)`);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(cx - rx, baseY);
      ctx.lineTo(cx - rx * 1.25, baseY - bw * 0.62);
      ctx.lineTo(cx + rx * 1.25, baseY - bw * 0.62);
      ctx.lineTo(cx + rx, baseY);
      ctx.closePath();
      ctx.fill();
      // base
      ctx.shadowColor = `hsla(${hue},100%,60%,1)`;
      ctx.shadowBlur = 16;
      ctx.strokeStyle = `hsla(${hue},100%,70%,${0.55 + amp * 0.3})`;
      ctx.lineWidth = 1.5;
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.ellipse(cx, baseY, rx * (1 - i * 0.22), ry * (1 - i * 0.22), 0, 0, Math.PI * 2);
        ctx.stroke();
      }
      // partículas subindo
      ctx.shadowBlur = 0;
      ctx.fillStyle = `hsla(${hue},100%,75%,.7)`;
      for (const d of dust) {
        d.y += d.v * 0.004 * (1 + amp * 2);
        if (d.y > 1) { d.y = 0; d.x = Math.random() * 2 - 1; }
        const px = cx + d.x * rx * (1 + d.y * 0.25), py = baseY - d.y * bw * 0.62;
        ctx.globalAlpha = (1 - d.y) * 0.8;
        ctx.fillRect(px, py, 1.6, 1.6);
      }
      ctx.restore();
    }

    function chameleon(t, amp, cx, cy, bw, bh, hue) {
      if (!fill) return;
      const breathe = 1 + 0.012 * Math.sin(t * 0.0018);
      const blink = t % 4700 < 150;
      const glitchOn = !reduceMotion && t % 6100 < 110;
      const glitch = glitchOn ? (Math.sin(t * 0.9) * 10) : 0;
      const gTop = cy - bh / 2 + ((Math.floor(t / 6100) * 0.37) % 1) * bh, gBot = gTop + bh * 0.12;
      const scanY = cy - bh * 0.7 + ((t * 0.00022) % 1) * bh * 1.4;
      const jawDrop = amp * bh * 0.075;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      // corpo translúcido com brilho
      ctx.globalAlpha = 0.12 + amp * 0.12;
      ctx.shadowColor = `hsla(${hue},100%,60%,1)`;
      ctx.shadowBlur = 26;
      ctx.drawImage(tinted, cx - bw / 2 + glitch * 0.5, cy - bh / 2, bw, bh);
      ctx.shadowBlur = 0;
      const place = (p) => {
        let px = cx + (p.nx - 0.5) * bw * breathe;
        let py = cy + (p.ny - 0.5) * bh * breathe;
        if (p.jaw) py += jawDrop * ((p.nx - 0.76) / 0.24);
        if (glitchOn && py > gTop && py < gBot) px += glitch;
        px += Math.sin(t * 0.003 + p.s) * 0.5;
        return [px, py];
      };
      const draw = (list, size, alpha, color, onlyScan) => {
        ctx.globalAlpha = alpha;
        ctx.fillStyle = color;
        for (let i = 0; i < list.length; i++) {
          const p = list[i];
          if (blink && p.eye) continue;
          const [px, py] = place(p);
          if (onlyScan && Math.abs(py - scanY) > 5) continue;
          ctx.fillRect(px, py, size, size);
        }
      };
      draw(fill, 1.3, 0.32 + amp * 0.38, `hsl(${hue},100%,62%)`);
      draw(edge, 1.7, 0.9, `hsl(${hue - 8},100%,80%)`);
      draw(fill, 1.6, 0.9, '#eafcff', true);
      ctx.restore();
    }

    let frameN = 0;
    function frame(t) {
      requestAnimationFrame(frame);
      if (document.hidden) return;
      frameN++;
      ampS += (amplitude(t) - ampS) * 0.25;
      const target = holoLayout === 'top' ? { cy: W < 700 ? 0.215 : 0.245, h: W < 700 ? 0.15 : 0.16 } : { cy: 0.43, h: 0.29 };
      lay.cy += (target.cy - lay.cy) * 0.07;
      lay.h += (target.h - lay.h) * 0.07;
      let bh = H * lay.h, bw = bh / aspect;
      if (bw > W * 0.7) { bw = W * 0.7; bh = bw * aspect; }
      const cx = W / 2, cy = H * lay.cy;
      const hue = HUE[mode] ?? 200;
      const speed = (mode === 'thinking' || mode === 'transcribing' ? 3 : mode === 'speaking' ? 1.6 : 1) * (reduceMotion ? 0.3 : 1);
      ctx.clearRect(0, 0, W, H);
      // brilho de fundo
      const R = bw * 0.62;
      const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 1.25);
      glow.addColorStop(0, `hsla(${hue},100%,55%,${0.12 + ampS * 0.14})`);
      glow.addColorStop(1, `hsla(${hue},100%,55%,0)`);
      ctx.fillStyle = glow;
      ctx.fillRect(cx - R * 1.3, cy - R * 1.3, R * 2.6, R * 2.6);
      rings(t, ampS, cx, cy, R, hue, speed);
      emitter(t, ampS, cx, cy + bh * 0.62, bw, hue);
      chameleon(t, ampS, cx, cy, bw, bh, hue);
      // medidor abaixo do status
      if (frameN % 2 === 0) {
        for (let i = 0; i < BARS; i++) {
          const mid = 1 - Math.abs(i - (BARS - 1) / 2) / (BARS / 2);
          const v = 2 + ampS * 10 * mid * (0.6 + 0.4 * Math.abs(Math.sin(t * 0.013 + i * 1.7)));
          bars[i].style.height = v.toFixed(1) + 'px';
        }
      }
    }
    requestAnimationFrame(frame);
  })();

  // ================= início =================
  /** Convite (uma vez) para ligar o "Chamar por Jarvis"; o clique em Ativar libera o microfone. */
  function offerWake() {
    if (!SR || wakeToggle.checked || store.get('jarvis_wake_oferecido', '') === '1') return;
    store.set('jarvis_wake_oferecido', '1');
    showCard({
      rotulo: 'JARVIS · VOZ',
      titulo: 'Quer me chamar pelo nome?',
      texto: 'Com isto ligado, é só dizer “Jarvis” e a pergunta, com esta aba aberta. O navegador fica ouvindo o ambiente enquanto a opção estiver ligada. Dá para desligar em GERENCIAR HUD.',
      botoes: [{ texto: 'Ativar', fn: () => { wakeToggle.checked = true; wakeToggle.onchange(); closeFocus(); subtitle('Pronto. Diga “Jarvis” e a pergunta.', 4000); } }],
    });
  }
  function afterLogin() {
    wakePaused = false;
    startWake();
    checkReminders();
    refreshMusicInfo();
    offerWake();
    subtitle('Diga “bom dia” ou toque no microfone.', 5000);
    showSetup(true);
    // Preenche o painel lateral sem falar nada.
    loadBriefingData().then(fillPulse).catch(() => {});
  }
  restMode();
  if (token) afterLogin(); else showLogin();
})();
</script>
